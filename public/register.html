<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - IAAMS</title>

  <!-- Google Fonts poppins font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- background mint green and form card majhkhane -->
  <div class="page-wrapper">
    <div class="auth-box">

      <!-- left overlay er pic -->
      <div class="auth-left">
        <!--register-banner.jpg-->
        <img src="./Resorces/loginBanner.jpg">

        <!-- Chobir upore text boshanor overlay box -->
        <div class="left-overlay">
          <div class="brand-name">AAMS</div>
          <h2 class="left-heading">Stay connected with your University</h2>
          <p class="left-text">Join events, network with fellow alumni, and give back to the community that shaped your journey.</p>
        </div>
      </div>

      <!-- Right side: Register Form -->
      <div class="auth-right">
        <h1 class="form-title">Create an account</h1>
        <p class="form-subtitle">Join the Alumni community</p>

        <form id="registerForm">

          <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Your full name" required />
          </div>

          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>

          <div class="input-row">
            <div class="input-group">
              <label for="batch">Batch</label>
              <input type="text" id="batch" placeholder="e.g. 2020" />
            </div>
            <div class="input-group">
              <label for="department">Department</label>
              <input type="text" id="department" placeholder="e.g. CSE" />
            </div>
          </div>

          <div class="input-group">
            <label for="graduationYear">Graduation Year</label>
            <input type="number" id="graduationYear" placeholder="e.g. 2024" />
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 6 characters" required />
          </div>

          <div class="input-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
          </div>

          <!-- error/success message show korbe -->
          <p id="errorMsg" class="message error-message hidden"></p>
          <p id="successMsg" class="message success-message hidden"></p>

          <button type="submit" class="submit-btn">Create Account</button>
        </form>

        <p class="switch-text">Already have an account? <a href="login.html">Log in</a></p>
      </div>

    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
