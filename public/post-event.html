<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Event - IAAMS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/post-event.css">
</head>
<body>

  <div class="dashboard-wrapper">

    <!-- ============ Sidebar ============ -->
    <div class="sidebar">
      <div class="sidebar-logo">IAAMS</div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-btn nav-link">Profile</a>
        <a href="dashboard.html" class="nav-btn nav-link">My Events</a>
        <a href="events.html" class="nav-btn nav-link">Browse Events</a>
        <a href="post-event.html" class="nav-btn nav-link active">Post Event</a>
        <a href="admin-panel.html" class="nav-btn nav-link hidden" id="adminPanelLink">Admin Panel</a>
      </nav>

      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <!-- ============ Main Content ============ -->
    <div class="main-content">

      <div class="page-header-box">
        <p class="breadcrumb">Dashboard / Post Event</p>
        <h1 class="page-heading">Post a New Event</h1>
      </div>

      <div class="form-box">
        <form id="postEventForm">

          <div class="input-group">
            <label for="title">Event Title</label>
            <input type="text" id="title" placeholder="e.g. Annual Alumni Meet" required />
          </div>

          <div class="input-group">
            <label for="description">Description</label>
            <textarea id="description" rows="4" placeholder="What is this event about? Why is it being organized?" required></textarea>
          </div>

          <div class="input-group">
            <label for="place">Place</label>
            <input type="text" id="place" placeholder="e.g. IUBAT Auditorium" required />
          </div>

          <div class="input-row">
            <div class="input-group">
              <label for="eventDate">Event Date</label>
              <input type="date" id="eventDate" required />
            </div>
            <div class="input-group">
              <label for="registrationDeadline">Registration Deadline</label>
              <input type="date" id="registrationDeadline" required />
            </div>
          </div>

          <div class="input-group">
            <label for="registrationFee">Registration Fee (TK)</label>
            <input type="number" id="registrationFee" placeholder="0 for free event" min="0" required />
          </div>

          <div class="input-group">
            <label for="bkashNumber">bKash Number (Payment receive korar jonno)</label>
            <input type="text" id="bkashNumber" placeholder="e.g. 01712345678" required />
          </div>

          <p id="errorMsg" class="message error-message hidden"></p>
          <p id="successMsg" class="message success-message hidden"></p>

          <button type="submit" class="submit-btn">Submit for Approval</button>

        </form>
      </div>

    </div>

  </div>

  <script src="js/post-event.js"></script>
</body>
</html>
