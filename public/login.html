<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - IAAMS</title>

  <!-- Google Fonts er poppins font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="page-wrapper">
    <div class="auth-box">

      <div class="auth-left">
        <img src="./Resorces/loginBanner.jpg" alt="IUBAT Alumni" class="left-image" />

        <!--left overlay er pic-->>
        <div class="left-overlay">
          <div class="brand-name">IAAMS</div>
          <h2 class="left-heading">Welcome back to your IUBAT family</h2>
          <p class="left-text">Log in to explore events, connect with alumni, and stay updated with your association.</p>
        </div>
      </div>

      <!-- Right side er form-->
      <div class="auth-right">
        <h1 class="form-title">Welcome back</h1>
        <p class="form-subtitle">Log in to your IAAMS account</p>

        <form id="loginForm">

          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required />
          </div>

          <!-- error/success message show kore -->
          <p id="errorMsg" class="message error-message hidden"></p>
          <p id="successMsg" class="message success-message hidden"></p>

          <button type="submit" class="submit-btn">Log In</button>
        </form>

        <p class="switch-text">Don't have an account? <a href="register.html">Register</a></p>
      </div>

    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
